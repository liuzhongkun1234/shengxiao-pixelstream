<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="color-scheme" content="dark" />
<title>圣效像素流</title>
<!-- 内联图标：不依赖任何外部资源 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b3b4a'/%3E%3Cpath d='M9 11h14M9 16h9M9 21h12' stroke='%2338d6ee' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
  :root { color-scheme: dark; --cyan:#38d6ee; --panel:rgba(18,26,32,.92); --line:rgba(56,214,238,.45);
    --glass:rgba(13,21,31,.5); --glass-line:rgba(255,255,255,.14); }
  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:#04090e; color:#dceaf2;
    font:14px/1.6 "Microsoft YaHei UI","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif; }
  /* 视频始终铺满窗口：窗口尺寸/全屏变化时由浏览器缩放，页面无需重算布局 */
  #video { position:fixed; inset:0; width:100%; height:100%; background:#000; object-fit:contain; outline:none; display:block; }
  #video.fill { object-fit:cover; }
  #video.novideo { opacity:0; }

  /* 加载/等待界面：网格底 + 扫描线 + 同心环核心 + 三阶段进度（科技感） */
  .overlay { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center;
    pointer-events:none; overflow:hidden; gap:14px; text-align:center; padding:24px;
    background:radial-gradient(ellipse at 50% 40%, #0a2233 0%, #050b12 55%, #03070c 100%);
    transition:opacity .3s ease; }
  .overlay.hidden { opacity:0; pointer-events:none; }
  .ovGrid { position:absolute; inset:-2px; opacity:.7;
    background-image:
      linear-gradient(rgba(56,214,238,.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56,214,238,.10) 1px, transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 45%, #000 0%, transparent 72%);
            mask-image:radial-gradient(ellipse at 50% 45%, #000 0%, transparent 72%); }
  .ovSweep { position:absolute; left:0; right:0; top:-160px; height:140px;
    background:linear-gradient(180deg, transparent, rgba(56,214,238,.09), transparent);
    animation:sweep 5.8s linear infinite; }
  @keyframes sweep { to { transform:translateY(calc(100vh + 320px)); } }

  .ovCore { position:relative; width:132px; height:132px; }
  .ovCore .ring { position:absolute; border-radius:50%; border:1px solid rgba(56,214,238,.28); }
  .ovCore .ring.r1 { inset:0; border-top-color:var(--cyan); border-right-color:var(--cyan); animation:spin 2.6s linear infinite; }
  .ovCore .ring.r2 { inset:17px; border-bottom-color:rgba(56,214,238,.85); animation:spin 1.7s linear infinite reverse; }
  .ovCore .ring.r3 { inset:34px; border-left-color:rgba(56,214,238,.85); animation:spin 1.1s linear infinite; }
  .ovCore .coreDot { position:absolute; inset:0; margin:auto; width:10px; height:10px; border-radius:50%;
    background:var(--cyan); box-shadow:0 0 18px 4px rgba(56,214,238,.55); animation:corePulse 1.6s ease-in-out infinite; }
  @keyframes corePulse { 50% { transform:scale(.7); opacity:.7; } }
  @keyframes spin { to { transform:rotate(360deg); } }
  .overlay.bad .ovCore .ring { border-color:rgba(255,107,107,.3); }
  .overlay.bad .ovCore .ring.r1 { border-top-color:#ff6b6b; border-right-color:#ff6b6b; animation-duration:5s; }
  .overlay.bad .ovCore .ring.r2 { border-bottom-color:#ff8f8f; animation-play-state:paused; }
  .overlay.bad .ovCore .ring.r3 { animation-play-state:paused; }
  .overlay.bad .ovCore .coreDot { background:#ff6b6b; box-shadow:0 0 18px 4px rgba(255,107,107,.5); animation:none; }

  .ovBrand { font-size:20px; font-weight:700; letter-spacing:.34em; color:#dff8ff;
    text-shadow:0 0 20px rgba(56,214,238,.45); }

  .ovSteps { display:flex; align-items:center; list-style:none; margin:0; padding:0; }
  .ovSteps li { position:relative; display:flex; align-items:center; gap:7px; padding:0 24px;
    font-size:12.5px; color:#7d97a5; transition:color .3s; }
  .ovSteps li + li::before { content:""; position:absolute; left:-26px; top:50%; width:52px; height:1px;
    background:rgba(56,214,238,.22); }
  .ovSteps li i { width:9px; height:9px; border-radius:50%; background:transparent;
    border:1px solid rgba(56,214,238,.4); transition:background .3s, box-shadow .3s; }
  .ovSteps li.done { color:#9fdcea; }
  .ovSteps li.done i { background:var(--cyan); border-color:var(--cyan); box-shadow:0 0 8px rgba(56,214,238,.7); }
  .ovSteps li.active { color:#eafcff; }
  .ovSteps li.active i { animation:corePulse 1.2s ease-in-out infinite; border-color:var(--cyan); }
  .overlay.bad .ovSteps { opacity:.45; }

  .ovStatus { font-size:16px; font-weight:600; color:#eaf6fb; letter-spacing:.04em; }
  .ovHint { font-size:13px; color:#8fa8b5; max-width:min(680px,90vw); white-space:pre-line; }
  .ovError { color:#ff9a9a; }
  /* 旧的圆环 spinner 由同心环核心取代（保留元素供脚本引用） */
  .spinner { display:none; }
  @media (prefers-reduced-motion: reduce) {
    .ovCore .ring, .ovCore .coreDot, .ovSweep { animation:none !important; }
  }

  /* 工具栏：玻璃拟态（半透明 + 背景模糊 + 高光边）；桌面端鼠标移到顶部显示，移动端点击热区切换 */
  #dock { position:fixed; z-index:30; top:0; left:50%; transform:translateX(-50%) translateY(-110%); display:flex; align-items:center; gap:4px;
    padding:5px 10px 6px;
    background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.015)), var(--glass);
    border:1px solid var(--glass-line); border-top:0; border-radius:0 0 14px 14px;
    box-shadow:0 10px 34px rgba(0,0,0,.42), inset 0 -1px 0 rgba(255,255,255,.05);
    backdrop-filter:blur(18px) saturate(150%); -webkit-backdrop-filter:blur(18px) saturate(150%);
    max-width:calc(100vw - 12px); overflow-x:auto;
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; }
  #dock.show { opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }
  #dock button { flex:0 0 auto; min-height:36px; padding:5px 12px; border:0; border-radius:9px; background:transparent; color:#e2eef4;
    font:inherit; cursor:pointer; white-space:nowrap; touch-action:manipulation;
    transition:background .18s, box-shadow .18s, color .18s; }
  #dock button:hover { background:rgba(255,255,255,.14); color:#fff; box-shadow:inset 0 0 0 1px rgba(255,255,255,.14); }
  #dock button.on { background:rgba(56,214,238,.22); color:#eafcff; box-shadow:inset 0 0 0 1px rgba(56,214,238,.35), 0 0 12px rgba(56,214,238,.25); }
  #dock .sep { flex:0 0 auto; width:1px; height:20px; background:rgba(255,255,255,.16); margin:0 2px; }
  #dockHot { position:fixed; z-index:29; top:0; left:0; right:0; height:36px; }

  /* 网络状态指示器（左上角常驻玻璃胶囊） */
  #netStatus { position:fixed; z-index:31; top:12px; left:14px; display:flex; align-items:center; gap:6px;
    background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.015)), var(--glass);
    border:1px solid var(--glass-line); border-radius:20px; padding:4px 12px 4px 10px;
    backdrop-filter:blur(14px) saturate(150%); -webkit-backdrop-filter:blur(14px) saturate(150%);
    box-shadow:0 4px 18px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.07);
    font-size:12px; color:#d5e4ee; pointer-events:none; transition:opacity .3s; }
  #netDot { width:8px; height:8px; border-radius:50%; background:#eab308; flex-shrink:0; transition:background .3s; }
  #netDot.ok { background:#22c55e; box-shadow:0 0 6px rgba(34,197,94,.5); }
  #netDot.warn { background:#eab308; box-shadow:0 0 6px rgba(234,179,8,.5); }
  #netDot.bad { background:#ef4444; box-shadow:0 0 6px rgba(239,68,68,.5); }

  /* 移动端适配 */
  @media (max-width: 768px) {
    #dock { gap:2px; padding:4px 6px 5px; }
    #dock button { min-height:40px; padding:6px 10px; font-size:12px; }
    #dock .sep { height:16px; margin:0 1px; }
    #netStatus { top:8px; left:10px; padding:3px 10px 3px 8px; font-size:11px; }
    #dockHot { height:32px; }
    .overlay h2 { font-size:20px; }
    .overlay p { font-size:13px; padding:0 20px; }
  }
  #pill { flex:0 0 auto; padding:3px 11px; border-radius:20px; font-size:12px;
    background:rgba(56,214,238,.14); border:1px solid rgba(56,214,238,.28); color:#bff3fb; }
  #pill.ok { background:rgba(87,216,121,.16); border-color:rgba(87,216,121,.32); color:#c6f5d3; }
  #pill.bad { background:rgba(255,107,107,.16); border-color:rgba(255,107,107,.32); color:#ffd0d0; }

  /* 诊断面板：玻璃卡片 */
  #panel { position:fixed; z-index:29; top:48px; right:10px; width:min(360px,calc(100vw - 20px)); max-height:calc(100vh - 62px);
    overflow-y:auto; padding:14px 16px;
    background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.015)), var(--glass);
    border:1px solid var(--glass-line); border-radius:14px;
    box-shadow:0 20px 52px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(20px) saturate(150%); -webkit-backdrop-filter:blur(20px) saturate(150%);
    display:none; }
  #panel.show { display:block; }
  #panel h3 { margin:0 0 8px; font-size:13px; color:var(--cyan); font-weight:600; }
  #panel dl { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:0 0 10px; font-size:12.5px; }
  #panel dt { color:#93aab6; }
  #panel dd { margin:0; overflow-wrap:anywhere; }
  #log { max-height:180px; overflow:auto; font:11.5px/1.55 Consolas,monospace; color:#a9c2ce; white-space:pre-wrap;
    border-top:1px dashed rgba(255,255,255,.14); padding-top:8px; }
  #imeField { position:fixed; left:50%; bottom:12%; width:1px; height:1px; opacity:.01; border:0; padding:0; z-index:5; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<video id="video" class="novideo" autoplay muted playsinline webkit-playsinline disablepictureinpicture></video>

<div id="overlay" class="overlay">
  <div class="ovGrid"></div>
  <div class="ovSweep"></div>
  <div class="ovCore">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="coreDot"></div>
  </div>
  <div class="ovBrand">圣效像素流</div>
  <ol class="ovSteps">
    <li id="ovStep1"><i></i><span>信令连接</span></li>
    <li id="ovStep2"><i></i><span>实例就绪</span></li>
    <li id="ovStep3"><i></i><span>画面传输</span></li>
  </ol>
  <div id="spinner" class="spinner"></div>
  <div id="ovStatus" class="ovStatus">正在初始化</div>
  <div id="ovHint" class="ovHint">正在读取连接参数…</div>
</div>

<div id="dockHot"></div>
<div id="netStatus"><div id="netDot" class="warn"></div><span id="netLabel">连接中…</span></div>
<div id="dock">
  <span id="pill">未连接</span>
  <button id="btnFull" type="button" title="切换全屏">全屏</button>
  <button id="btnFit" type="button" title="在完整显示与铺满之间切换">完整显示</button>
  <button id="btnSound" type="button" title="开启/关闭声音">已静音</button>
  <button id="btnIme" type="button" title="开启中文（输入法）输入">中文输入</button>
  <button id="btnRole" type="button" title="输入控制权">只读观看</button>
  <button id="btnDiag" type="button" title="显示诊断信息">诊断</button>
</div>

<div id="panel">
  <h3>连接诊断</h3>
  <dl>
    <dt>信令</dt><dd id="dSignal">—</dd>
    <dt>会话</dt><dd id="dSession">—</dd>
    <dt>实例</dt><dd id="dInstance">—</dd>
    <dt>协议</dt><dd id="dProtocol">—</dd>
    <dt>控制通道</dt><dd id="dChannel">—</dd>
    <dt>连接方式</dt><dd id="dRoute">—</dd>
    <dt>画面尺寸</dt><dd id="dVideo">—</dd>
    <dt>目标分辨率</dt><dd id="dTarget">—</dd>
    <dt>帧率 / 码率</dt><dd id="dFps">—</dd>
    <dt>往返延迟</dt><dd id="dRtt">—</dd>
    <dt>码率上限</dt><dd id="dBitrate">—</dd>
    <dt>角色</dt><dd id="dRole">—</dd>
  </dl>
  <div id="log"></div>
</div>

<textarea id="imeField" aria-label="远程文字输入" autocomplete="off" autocapitalize="off" spellcheck="false" tabindex="-1"></textarea>

<script>
/* ============================================================================
 * 圣效像素流 · 单文件播放页
 * ----------------------------------------------------------------------------
 * 无外部依赖（不引用任何 CDN / 库）。信令、WebRTC、输入通道全部内联实现。
 * 兼容 UE5.3 经典 PixelStreaming（protocol=legacy）与 UE5.8 PixelStreaming2
 * （protocol=unified），两者差异见同目录 PROTOCOL.md。
 * ==========================================================================*/
(function () {
  'use strict';

  var BRAND = '圣效像素流';
  var params = new URLSearchParams(location.search);

  /* ------------------------------------------------------------------ *
   * 1. 协议常量（必须与 UE 的 EToUE4Msg / EToClientMsg 枚举保持一致）
   * ------------------------------------------------------------------ */
  var SpecialKeyCodes = {
    Backspace: 8, ShiftLeft: 16, ControlLeft: 17, AltLeft: 18,
    ShiftRight: 253, ControlRight: 254, AltRight: 255
  };
  // UE -> 浏览器  （EToClientMsg）
  var RECEIVE = {
    QualityControlOwnership: 0, Response: 1, Command: 2, FreezeFrame: 3, UnfreezeFrame: 4,
    VideoEncoderAvgQP: 5, LatencyTest: 6, InitialSettings: 7, FileExtension: 8, FileMimeType: 9,
    FileContents: 10, InputControlOwnership: 12, CompositionStart: 64, Protocol: 255
  };
  // 浏览器 -> UE  （EToUE4Msg）；unified 模式下 UE 可能通过 Protocol(255) 重映射这些 id
  var SEND = {
    IFrameRequest: 0, RequestQualityControl: 1, FpsRequest: 2, AverageBitrateRequest: 3,
    StartStreaming: 4, StopStreaming: 5, LatencyTest: 6, RequestInitialSettings: 7,
    UIInteraction: 50, Command: 51,
    KeyDown: 60, KeyUp: 61, KeyPress: 62, FindFocus: 63, CompositionEnd: 64,
    MouseEnter: 70, MouseLeave: 71, MouseDown: 72, MouseUp: 73, MouseMove: 74, MouseWheel: 75,
    TouchStart: 80, TouchEnd: 81, TouchMove: 82
  };

  var TERMINAL_REASONS = {
    user_idle_timeout: 1, max_session_duration: 1, queue_fair_use_limit: 1, queue_wait_timeout: 1,
    admin_requested: 1, admin_project_stop: 1, admin_stop_all: 1, settings_changed: 1,
    instance_idle_timeout: 1, network_disconnect_timeout: 1, last_player_left: 1,
    turn_capacity_reached: 1, turn_daily_budget_exhausted: 1
  };
  var REASON_TEXT = {
    user_idle_timeout: '长时间未操作，实例已自动结束。',
    max_session_duration: '本次访问已达到最长使用时间，实例已回收。',
    network_disconnect_timeout: '连接中断超过恢复宽限时间，实例已回收。',
    engine_disconnected: 'UE 程序与服务的连接已断开。',
    process_exited: 'UE 程序已退出。',
    ue_engine_connect_timeout: 'UE 启动或连接信令超时。',
    ue_engine_proxy_blocked: '检测到代理或 VPN，UE 未能连接本机信令服务。',
    pixel_streaming_plugin_missing: 'UE 的像素流插件未正确加载。',
    ue_webrtc_protocol_incompatible: 'UE 的 WebRTC 协议与当前模式不兼容。',
    admin_requested: '管理员已结束当前实例。',
    last_player_left: '最后一位观看者离开，实例已回收。',
    codec_switch_requested: '正在切换编码器，实例重新启动。',
    turn_capacity_reached: '中继资源已达并发上限。',
    turn_daily_budget_exhausted: '中继流量额度已用完。'
  };

  /* ------------------------------------------------------------------ *
   * 2. URL 参数
   *    ?project=PCC3476A&token=xxx[&share=yyy][&port=12188][&host=1.2.3.4]
   *    [&ice=host|server|stun:..][&adaptive=0][&audio=0][&viewOnly=1][&debug=1]
   * ------------------------------------------------------------------ */
  var cfg = (function () {
    var proto = String(location.protocol || '').toLowerCase();
    return {
      project: params.get('project') || params.get('projectId') || '',
      token: params.get('token') || '',
      share: params.get('share') || '',
      viewOnly: params.get('viewOnly') === '1',
      host: params.get('host') || location.hostname || '127.0.0.1',
      // 端口：优先 URL 参数，其次取页面自身端口（播放页与信令同端口），最后回落 12188
      port: params.get('port') || location.port || '12188',
      scheme: params.get('scheme') || (proto === 'https:' ? 'wss' : 'ws'),
      // 局域网优先：默认 ICE 留空，只收集 host 候选，完全不解析外网 STUN。
      ice: params.get('ice') || 'host',
      adaptive: params.get('adaptive') !== '0',
      audio: params.get('audio') !== '0',
      debug: params.get('debug') === '1'
    };
  })();

  var dom = {
    video: document.getElementById('video'),
    overlay: document.getElementById('overlay'),
    spinner: document.getElementById('spinner'),
    ovStatus: document.getElementById('ovStatus'),
    ovHint: document.getElementById('ovHint'),
    pill: document.getElementById('pill'),
    btnFull: document.getElementById('btnFull'),
    btnFit: document.getElementById('btnFit'),
    dock: document.getElementById('dock'),
    dockHot: document.getElementById('dockHot'),
    netDot: document.getElementById('netDot'),
    netLabel: document.getElementById('netLabel'),
    btnSound: document.getElementById('btnSound'),
    btnIme: document.getElementById('btnIme'),
    btnRole: document.getElementById('btnRole'),
    btnDiag: document.getElementById('btnDiag'),
    panel: document.getElementById('panel'),
    log: document.getElementById('log'),
    imeField: document.getElementById('imeField'),
    dSignal: document.getElementById('dSignal'),
    dSession: document.getElementById('dSession'),
    dInstance: document.getElementById('dInstance'),
    dProtocol: document.getElementById('dProtocol'),
    dChannel: document.getElementById('dChannel'),
    dRoute: document.getElementById('dRoute'),
    dVideo: document.getElementById('dVideo'),
    dTarget: document.getElementById('dTarget'),
    dFps: document.getElementById('dFps'),
    dRtt: document.getElementById('dRtt'),
    dBitrate: document.getElementById('dBitrate'),
    dRole: document.getElementById('dRole')
  };

  /* ------------------------------------------------------------------ *
   * 3. 运行时状态（同时暴露给自动化测试读取）
   * ------------------------------------------------------------------ */
  var state = {
    brand: BRAND,
    phase: 'init',                 // init|connecting|waiting-instance|connected|failed|ended
    status: '正在初始化',
    detail: '',
    wsUrl: '',
    wsReady: -1,                   // WebSocket.readyState
    sessionId: '',
    instanceId: '',
    projectName: '',
    protocol: '',                  // legacy | unified
    plugin: '',                    // PixelStreaming | PixelStreaming2
    role: 'controller',            // controller | viewer
    adaptiveAllowed: true,         // hello.adaptiveResolution !== false
    screenPercentage: 0,
    iceMode: cfg.ice,
    route: '',                     // 局域网直连 / 中继 / 检测中
    localCandidate: '', remoteCandidate: '', transport: '',
    dcState: 'none',
    videoWidth: 0, videoHeight: 0,
    targetResolution: null,
    lastSentResolution: null,
    fps: 0, bitrateMbps: 0, rttMs: 0,
    appliedBitrateMbps: 0,
    ue53: false,
    received: [],                  // 收到的信令消息类型（按序）
    reconnectAttempt: 0,
    errorCode: '',
    log: []
  };
  var live = {
    ws: null,
    pc: null,
    dc: null,
    remoteStream: null,
    serverIce: null,
    serverIcePolicy: undefined,
    iceServers: [],
    connecting: false,             // 正在建立 pc（防止重复 playerConnected）
    offerInProgress: false,
    negotiationArmed: false,
    protocolMappingReceived: false,
    manualClose: false,
    terminal: false,
    reconnectTimer: null,
    iceRestartTimer: null,
    disconnectTimer: null,
    iceRestartAttempts: 0,
    resolutionTimer: null,
    resolutionVerifyTimer: null,
    statsTimer: null,
    resendTimer: null,
    qp: 0,
    lastStats: null,
    prev: null,
    keyDown: {},
    buttonsDown: {},
    fit: 'contain',
    unmuted: false,
    videoReadyTimer: null,
    videoStarted: false,
    activityAt: 0
  };

  /* ------------------------------------------------------------------ *
   * 4. 小工具：状态显示 / 日志
   * ------------------------------------------------------------------ */
  function logLine(text) {
    var t = new Date().toTimeString().slice(0, 8);
    var line = '[' + t + '] ' + text;
    state.log.push(line);
    if (state.log.length > 300) state.log.shift();
    dom.log.textContent = state.log.slice(-120).join('\n');
    dom.log.scrollTop = dom.log.scrollHeight;
  }
  function trace(dir, type, extra) {
    var item = dir + ' ' + type + (extra ? (' ' + extra) : '');
    logLine(item);
  }
  function isTerminalReason(code) { return !!TERMINAL_REASONS[String(code || '')]; }

  function setStatus(phase, text, hint, isError) {
    // 画面已经稳定播放时，忽略服务端下发的"等待实例 / 正在建立视频连接"等中间态：
    // 这些事件在播放中途也会到达，之前会把状态栏和遮罩打回"加载中"——
    // 用户看到的现象就是"加载界面先消失、过一会儿又弹回来"。
    var playing = live.videoStarted && live.pc && live.pc.connectionState === 'connected';
    if (playing && (phase === 'waiting-instance' || phase === 'connecting')) {
      phase = 'connected';
      text = '已连接';
      hint = '';
      isError = false;
    }
    state.phase = phase;
    state.status = text;
    state.detail = hint || '';
    dom.ovStatus.textContent = text;
    dom.ovHint.textContent = hint || '';
    dom.ovHint.className = isError ? 'ovHint ovError' : 'ovHint';
    var pillText = { init: '未连接', connecting: '连接中', 'waiting-instance': '等待实例', connected: '已连接', failed: '失败', ended: '已结束' }[phase] || '未连接';
    dom.pill.textContent = pillText;
    dom.pill.className = phase === 'connected' ? 'ok' : (phase === 'failed' || phase === 'ended' ? 'bad' : '');
    // 左上角网络状态指示
    var netCls = phase === 'connected' ? 'ok' : (phase === 'failed' || phase === 'ended') ? 'bad' : 'warn';
    var netTxt = phase === 'connected' ? '已连接' : (phase === 'failed' || phase === 'ended') ? '已断开' : '连接中…';
    if (dom.netDot) dom.netDot.className = netCls;
    if (dom.netLabel) dom.netLabel.textContent = netTxt;
    // 遮罩显隐：出过画面之后，只有"确实失败/结束"才重新盖回来；
    // 信令断开重连等中间态由左上角状态徽标提示，不遮挡正在播放的画面。
    var showOverlay = live.videoStarted ? (phase === 'failed' || phase === 'ended') : true;
    dom.overlay.classList.toggle('hidden', !showOverlay);
    dom.spinner.classList.toggle('hidden', phase === 'failed' || phase === 'ended');
    updateSteps(phase);
    document.title = BRAND + (phase === 'connected' ? '' : ' · ' + pillText);
    refreshDiag();
  }
  /** 加载界面的阶段进度：信令连接 → 实例就绪 → 画面传输 */
  function updateSteps(phase) {
    var idx = phase === 'waiting-instance' ? 2 : phase === 'connected' ? 3 : 1;
    if (phase === 'failed' || phase === 'ended') idx = 0; // 失败/结束时不推进，保持现有进度
    if (idx > 0) {
      for (var i = 1; i <= 3; i++) {
        var el = document.getElementById('ovStep' + i);
        if (el) el.className = i < idx ? 'done' : i === idx ? 'active' : '';
      }
    }
    dom.overlay.classList.toggle('bad', phase === 'failed' || phase === 'ended');
  }
  function setRoute() {
    if (!live.lastStats) { state.route = '检测中'; return; }
    var lt = state.localCandidate, rt = state.remoteCandidate;
    if (lt === 'relay' || rt === 'relay') state.route = '中继转发';
    else if (lt || rt) state.route = '局域网直连（' + (lt || rt) + '）';
    else state.route = '检测中';
  }
  function refreshDiag() {
    dom.dSignal.textContent = cfg.scheme + '://' + cfg.host + ':' + cfg.port + '/player';
    dom.dSession.textContent = state.sessionId || '—';
    dom.dInstance.textContent = state.instanceId || '—';
    var protocolLabel = state.protocol === 'legacy' ? 'legacy（经典像素流）'
      : state.protocol === 'unified' ? 'unified（像素流 2）' : '—';
    dom.dProtocol.textContent = protocolLabel + (state.ue53 ? '（UE5.3 兼容）' : '');
    dom.dChannel.textContent = state.dcState + (state.role === 'viewer' ? '（只读观看）' : '');
    dom.dRoute.textContent = state.route + (state.transport ? '｜' + state.transport : '');
    dom.dVideo.textContent = state.videoWidth ? state.videoWidth + ' × ' + state.videoHeight : '—';
    dom.dTarget.textContent = state.targetResolution
      ? state.targetResolution.width + ' × ' + state.targetResolution.height + (state.adaptiveAllowed ? '' : '（服务端已关闭动态分辨率）')
      : (state.adaptiveAllowed ? '—' : '服务端已关闭动态分辨率');
    dom.dFps.textContent = (state.fps ? state.fps.toFixed(0) + ' fps' : '—') + '｜' + (state.bitrateMbps ? state.bitrateMbps.toFixed(2) + ' Mbps' : '—');
    dom.dRtt.textContent = state.rttMs ? (state.rttMs * 1000).toFixed(0) + ' ms' : '—';
    dom.dBitrate.textContent = state.appliedBitrateMbps ? state.appliedBitrateMbps + ' Mbps' : '未下发';
    dom.dRole.textContent = state.role === 'viewer' ? '只读观看' : '可控制';
  }

  /* ------------------------------------------------------------------ *
   * 5. WebSocket 信令
   * ------------------------------------------------------------------ */
  function stableId(store, key) {
    try {
      var v = store.getItem(key) || '';
      if (/^[a-f0-9-]{32,40}$/i.test(v)) return v;
      v = (globalThis.crypto && crypto.randomUUID) ? crypto.randomUUID()
        : Array.from((globalThis.crypto ? crypto.getRandomValues(new Uint8Array(16)) : new Uint8Array(16)), function (x) { return x.toString(16).padStart(2, '0'); }).join('');
      store.setItem(key, v);
      return v;
    } catch (e) { return ''; }
  }
  function clientCapabilities() {
    var codecs = [];
    try {
      var caps = (globalThis.RTCRtpReceiver && RTCRtpReceiver.getCapabilities) ? RTCRtpReceiver.getCapabilities('video') : null;
      var seen = {};
      (caps && caps.codecs || []).forEach(function (c) {
        var name = String(c.mimeType || '').split('/').pop().toUpperCase();
        if (['AV1', 'H264', 'VP8', 'VP9'].indexOf(name) >= 0 && !seen[name]) { seen[name] = 1; codecs.push(name); }
      });
    } catch (e) { /* 忽略：能力探测失败不影响连接 */ }
    var mobile = (navigator.userAgentData && navigator.userAgentData.mobile === true) ||
      ((window.matchMedia && matchMedia('(pointer:coarse)').matches) && Math.min(screen.width, screen.height) < 900);
    return { codecs: codecs, mobile: mobile, platform: String((navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || 'unknown').slice(0, 32) };
  }
  function buildWsUrl() {
    var u = new URL(cfg.scheme + '://' + cfg.host + ':' + cfg.port + '/player');
    u.searchParams.set('project', cfg.project);
    if (cfg.token) u.searchParams.set('token', cfg.token);
    if (cfg.share) u.searchParams.set('share', cfg.share);
    if (cfg.viewOnly) u.searchParams.set('viewOnly', '1');
    var caps = clientCapabilities();
    var client = stableId(safeStore('localStorage'), 'sxl.clientId');
    var tab = stableId(safeStore('sessionStorage'), 'sxl.tabId');
    if (client) u.searchParams.set('client', client);
    if (tab) u.searchParams.set('tab', tab);
    if (caps.codecs.length) u.searchParams.set('codecs', caps.codecs.join(','));
    u.searchParams.set('mobile', caps.mobile ? '1' : '0');
    u.searchParams.set('platform', caps.platform);
    var av1 = params.get('av1') === '1' ? '1' : '0';
    u.searchParams.set('av1', av1);
    var av1Factor = params.get('av1Factor');
    if (av1Factor) u.searchParams.set('av1Factor', av1Factor);
    return u.toString();
  }
  function safeStore(name) {
    try { return globalThis[name] || null; } catch (e) { return null; }
  }
  function sendJson(value) {
    try {
      if (live.ws && live.ws.readyState === WebSocket.OPEN) { live.ws.send(JSON.stringify(value)); return true; }
    } catch (e) { logLine('发送信令失败：' + (e && e.message)); }
    return false;
  }

  function connect() {
    if (!cfg.project) { setStatus('failed', '缺少项目参数', '请在地址后加上 ?project=项目编号&token=访问令牌', true); return; }
    if (!cfg.token && !cfg.share) { setStatus('failed', '缺少访问令牌', '请在地址后加上 &token=访问令牌（公网分享链接可用 share 参数代替）', true); return; }

    live.manualClose = false;
    live.terminal = false;
    state.received = [];
    setRoute();
    state.route = '检测中';
    state.received = [];
    live.connecting = false;
    live.negotiationArmed = false;
    live.protocolMappingReceived = false;
    closePeer();
    state.dcState = 'none';
    state.errorCode = '';

    state.wsUrl = buildWsUrl();
    setStatus('connecting', '正在连接信令服务', '地址：' + cfg.host + ':' + cfg.port + '　项目：' + cfg.project +
      (live.reconnectAttempt ? '\n第 ' + live.reconnectAttempt + ' 次重连' : ''));

    var ws;
    try {
      // 不声明子协议：服务端按 URL 路径 /player 区分角色，不校验 Sec-WebSocket-Protocol。
      ws = new WebSocket(state.wsUrl);
    } catch (e) {
      scheduleReconnect('无法建立 WebSocket：' + (e && e.message));
      return;
    }
    live.ws = ws;
    state.wsReady = WebSocket.CONNECTING;

    ws.onopen = function () {
      if (live.ws !== ws) return;
      state.wsReady = WebSocket.OPEN;
      trace('↑', 'ws.open');
      setStatus('waiting-instance', '信令已连接，等待实例', '正在申请 UE 实例，请稍候…');
    };
    ws.onmessage = function (ev) {
      if (live.ws !== ws) return;
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { logLine('忽略非 JSON 消息'); return; }
      if (!msg || typeof msg.type !== 'string') return;
      state.received.push(msg.type);
      handleSignal(msg);
    };
    ws.onerror = function () {
      if (live.ws !== ws) return;
      logLine('信令 WebSocket 出错');
    };
    ws.onclose = function (ev) {
      if (live.ws !== ws) return;
      state.wsReady = WebSocket.CLOSED;
      trace('↓', 'ws.close', 'code=' + (ev && ev.code));
      // 关键修复：画面已在播放时，信令断开不销毁 WebRTC 视频连接。
      // WebRTC 媒体流独立于信令 WebSocket，断信令只是失去码率/分辨率控制，
      // 视频应继续播放；只重连信令即可。只有画面还没出来才整体重来。
      if (!live.videoStarted || !live.pc || live.pc.connectionState !== 'connected') {
        closePeer();
      } else {
        logLine('信令断开但视频仍在播放，仅重连信令…');
      }
      if (live.manualClose || live.terminal) return;
      scheduleReconnect('信令连接已断开（code ' + ((ev && ev.code) || 0) + '）');
    };
  }

  function scheduleReconnect(reason) {
    if (live.terminal) return;
    live.reconnectAttempt += 1;
    if (live.reconnectAttempt > 6) {
      setStatus('failed', '连接失败', reason + '\n已重试 6 次，请检查服务是否运行，或点击“诊断”查看详情。', true);
      return;
    }
    setStatus('connecting', '连接中断，正在重连', reason + '\n第 ' + live.reconnectAttempt + ' 次重试…', true);
    clearTimeout(live.reconnectTimer);
    live.reconnectTimer = setTimeout(connect, Math.min(8000, 1200 * live.reconnectAttempt));
  }

  /* ------------------------------------------------------------------ *
   * 6. 信令消息分发
   * ------------------------------------------------------------------ */
  function handleSignal(msg) {
    switch (msg.type) {
      case 'hello': onHello(msg); break;
      case 'playerConnected': onPlayerConnected(msg); break;      // legacy：浏览器发起 offer
      case 'offer': onRemoteOffer(msg); break;                    // unified：UE 发起 offer
      case 'answer': onRemoteAnswer(msg); break;
      case 'iceCandidate': onRemoteCandidate(msg.candidate); break;
      case 'seticeServers': onIceServers(msg); break;
      case 'ping': sendJson(Object.assign({}, msg, { type: 'pong' })); break;
      case 'instance.lifecycle':
      case 'instanceLifecycle': onLifecycle(msg); break;
      case 'session.control.role': onControlRole(msg); break;
      case 'sessionIdleWarning':
      case 'session.idle_warning': onIdleWarning(msg); break;
      case 'bitrate.policy': onBitratePolicy(msg); break;
      case 'playerqueue': onQueue(msg); break;
      case 'getStatus': onGetStatus(msg); break;
      case 'setmouseReleaseTime': break;   // 空闲计时由服务端 session.activity 统一管理
      case 'ueDisConnected':
        setStatus('waiting-instance', 'UE 连接已断开', '实例可能正在重启，请稍候…', true); break;
      case 'error': onError(msg); break;
      default: logLine('未处理的消息：' + msg.type); break;
    }
  }

  function onHello(msg) {
    trace('↓', 'hello', 'protocol=' + msg.pixelStreamingProtocol);
    state.sessionId = String(msg.sessionId || '');
    state.projectName = msg.projectName || msg.projectId || cfg.project;
    state.protocol = msg.pixelStreamingProtocol || 'unified';
    state.plugin = msg.pixelStreamingPlugin || (state.protocol === 'legacy' ? 'PixelStreaming' : 'PixelStreaming2');
    state.adaptiveAllowed = msg.adaptiveResolution !== false;
    state.screenPercentage = [100, 85, 75, 67].indexOf(Number(msg.screenPercentage)) >= 0 ? Number(msg.screenPercentage) : 0;
    var codec = msg.codecObservation || {};
    state.ue53 = /^5\.3(?:\D|$)/.test(String(codec.ueVersion || ''));
    if (msg.readOnly) setRole('viewer');
    setStatus('waiting-instance', '已建立会话，等待实例', '项目：' + state.projectName + '　协议：' + state.protocol);
  }

  function onLifecycle(msg) {
    trace('↓', 'instance.lifecycle', 'state=' + msg.state + (msg.phase ? (' phase=' + msg.phase) : '') + (msg.reasonCode ? (' reason=' + msg.reasonCode) : ''));
    if (msg.instanceId) state.instanceId = String(msg.instanceId);
    if (msg.projectName) state.projectName = msg.projectName;
    if (msg.inputRole) setRole(msg.inputRole);
    if (msg.state === 'running') {
      live.reconnectAttempt = 0;
      live.iceRestartAttempts = 0;
      live.terminal = false;
      setStatus('connected', '已连接', '');
      scheduleResolution(0);
    } else if (msg.state === 'starting') {
      setStatus('waiting-instance', '正在启动实例', (msg.message || '') + '\n项目：' + (state.projectName || cfg.project));
    } else if (msg.state === 'connecting') {
      // 局域网直连模式下不会配置 TURN 中继，服务端的"未获得中继地址"属于正常提示，
      // 这里改成对用户友好的说法，避免误以为卡住了
      var phaseText = {
        engine_configured: '实例已启动，等待 UE 引擎接入',
        engine_disconnected: 'UE 引擎已断开，等待重连',
        turn_ready: '中继通道已就绪，正在建立视频连接',
        turn_unavailable: '正在建立画面连接…',
        turn_backup_unavailable: '正在建立画面连接（局域网直连）'
      }[msg.phase];
      var phaseHint = msg.message || '';
      if (msg.phase === 'turn_unavailable' || msg.phase === 'turn_backup_unavailable' || msg.phase === 'engine_configured') {
        phaseHint = '局域网直连模式，通常 3~10 秒出画面；若长时间无画面请检查防火墙或换个浏览器';
      }
      setStatus('waiting-instance', phaseText || '正在建立视频连接', phaseHint);
    } else if (msg.state === 'stopping' || msg.state === 'ended') {
      live.terminal = true;
      clearTimeout(live.reconnectTimer);
      closePeer();
      var reason = msg.reasonCode || '';
      var text = msg.message || REASON_TEXT[reason] || '当前实例已结束。';
      setStatus('ended', '实例已结束', text + (reason ? '\n原因码：' + reason : ''), true);
    }
  }

  function onError(msg) {
    var code = String(msg.code || 'connection_failed');
    state.errorCode = code;
    trace('↓', 'error', code);
    live.terminal = true;
    clearTimeout(live.reconnectTimer);
    var text = code === 'allocation_failed'
      ? '项目启动失败（allocation_failed）。请确认 UE 程序可正常启动，且执行端服务已连接。'
      : '连接未成功（' + code + '）。';
    setStatus('failed', '连接失败', text, true);
  }

  function onQueue(msg) {
    var position = msg.position || msg.queuePosition || '—';
    setStatus('waiting-instance', '正在排队等待实例', '排队位置：' + position + (msg.message ? '\n' + msg.message : ''));
  }

  function onIdleWarning(msg) {
    var seconds = Math.max(0, Number(msg.remainingSeconds) || 0);
    setStatus('waiting-instance', '即将结束实例', '长时间未操作，实例将在 ' + seconds + ' 秒后自动结束。移动鼠标或按键即可继续。', true);
  }

  function setRole(role) {
    var viewer = role === 'viewer';
    state.role = viewer ? 'viewer' : 'controller';
    dom.btnRole.textContent = viewer ? '只读观看' : '可控制';
    dom.btnRole.classList.toggle('on', viewer);
    if (viewer) releaseInput();
    refreshDiag();
  }
  function onControlRole(msg) {
    trace('↓', 'session.control.role', String(msg.role || ''));
    setRole(msg.role === 'viewer' ? 'viewer' : 'controller');
    if (msg.role !== 'viewer') setStatus('connected', '已连接', '');
  }

  /* ------------------------------------------------------------------ *
   * 7. WebRTC：连接建立（legacy 自建 offer / unified 应答 offer）
   * ------------------------------------------------------------------ */
  function onIceServers(msg) {
    live.serverIce = Array.isArray(msg.iceServers) ? msg.iceServers : [];
    live.serverIcePolicy = msg.iceTransportPolicy === 'relay' ? 'relay' : undefined;
    logLine('服务端 ICE 配置：' + (live.serverIce.length ? live.serverIce.length + ' 组' : '空') + '（本页模式：' + cfg.ice + '）');
  }
  function effectiveIce() {
    if (cfg.ice === 'server') {
      live.iceServers = live.serverIce || [];
      return { iceServers: live.iceServers, iceTransportPolicy: live.serverIcePolicy };
    }
    if (cfg.ice !== 'host') {
      live.iceServers = cfg.ice.split(',').map(function (u) { return { urls: u.trim() }; }).filter(function (x) { return x.urls; });
      return { iceServers: live.iceServers };
    }
    // 默认：空 ICE 列表 = 只收集 host 候选，不解析任何外网 STUN，局域网内可立即出画面。
    live.iceServers = [];
    return { iceServers: [] };
  }

  function closePeer() {
    try { live.dc && live.dc.close(); } catch (e) { }
    try { live.pc && live.pc.close(); } catch (e) { }
    live.dc = null;
    live.pc = null;
    live.remoteStream = null;
    live.connecting = false;
    live.negotiationArmed = false;
    state.dcState = 'none';
    try { dom.video.srcObject = null; } catch (e) { }
    dom.video.classList.add('novideo');
    state.videoWidth = 0;
    state.videoHeight = 0;
    stopStats();
    refreshDiag();
  }

  function createPeerConnection() {
    if (live.pc) return live.pc;
    var ice = effectiveIce();
    var options = { bundlePolicy: 'balanced', iceServers: ice.iceServers };
    if (ice.iceTransportPolicy) options.iceTransportPolicy = ice.iceTransportPolicy;
    var pc = new RTCPeerConnection(options);
    live.pc = pc;
    live.remoteStream = new MediaStream();
    live.connecting = true;
    logLine('创建 WebRTC 连接（ICE 候选来源：' + (ice.iceServers.length ? '自定义/服务端 ' + ice.iceServers.length + ' 组' : '仅 host 局域网候选') + '）');

    pc.ontrack = function (ev) {
      if (live.pc !== pc) return;
      if (!live.remoteStream) live.remoteStream = new MediaStream();
      if (!live.remoteStream.getTracks().some(function (t) { return t.id === ev.track.id; })) live.remoteStream.addTrack(ev.track);
      dom.video.srcObject = live.remoteStream;
      if (ev.track.kind === 'video') {
        dom.video.classList.remove('novideo');
        tryPlay();
        armVideoReadyFallback();
      }
    };
    pc.onicecandidate = function (ev) {
      if (live.pc !== pc) return;
      if (ev.candidate && ev.candidate.candidate) sendJson({ type: 'iceCandidate', candidate: ev.candidate });
    };
    pc.ondatachannel = function (ev) {
      if (live.pc !== pc) return;
      setupDataChannel(ev.channel);
    };
    pc.onconnectionstatechange = pc.oniceconnectionstatechange = function () {
      if (live.pc !== pc) return;
      var peer = pc.connectionState, iceState = pc.iceConnectionState;
      if (peer === 'connected' || iceState === 'connected' || iceState === 'completed') {
        clearTimeout(live.iceRestartTimer);
        clearTimeout(live.disconnectTimer);
        live.iceRestartAttempts = 0;
        startStats();
      } else if (peer === 'disconnected' || iceState === 'disconnected') {
        // 临时断开：等 5 秒自愈（网络抖动很常见）
        clearTimeout(live.disconnectTimer);
        live.disconnectTimer = setTimeout(function () {
          if (live.pc !== pc) return;
          if (pc.connectionState === 'disconnected' || pc.iceConnectionState === 'disconnected') {
            logLine('连接中断超过 5 秒，尝试 ICE 重启…');
            tryRestartIce(pc);
          }
        }, 5000);
      } else if (peer === 'failed' || iceState === 'failed') {
        // 连接失败：先试 ICE 重启（不销毁视频），最多 2 次
        tryRestartIce(pc);
      }
    };
    return pc;
  }

  /**
   * ICE 重启：不销毁 WebRTC 连接，只重新协商网络路径。
   * 比整条连接重建快得多，而且视频流不中断（或只断一瞬间）。
   */
  function tryRestartIce(pc) {
    if (live.iceRestartAttempts >= 2) {
      logLine('ICE 重启已用尽，走完整重连');
      closePeer();
      if (!live.terminal && !live.manualClose && live.ws && live.ws.readyState === WebSocket.OPEN) {
        scheduleReconnect('视频通道建立失败');
        try { live.ws.close(1000, 'transport failed'); } catch (e) { }
      }
      return;
    }
    live.iceRestartAttempts = (live.iceRestartAttempts || 0) + 1;
    logLine('ICE 重启（第 ' + live.iceRestartAttempts + ' 次）');
    try {
      if (pc.restartIce) pc.restartIce();
      // 重新发起协商：legacy 由浏览器建 offer，unified 等 UE 发
      if (state.protocol === 'legacy' && live.ws && live.ws.readyState === WebSocket.OPEN) {
        pc.createOffer({ iceRestart: true }).then(function (offer) {
          return pc.setLocalDescription(offer).then(function () {
            sendJson({ type: 'offer', sdp: pc.localDescription.sdp });
          });
        }).catch(function (e) { logLine('ICE 重启协商失败：' + e.message); });
      }
    } catch (e) {
      logLine('ICE 重启异常：' + (e && e.message));
    }
    // 8 秒后还没恢复就走完整重连
    clearTimeout(live.iceRestartTimer);
    live.iceRestartTimer = setTimeout(function () {
      if (live.pc === pc && pc.connectionState !== 'connected') {
        logLine('ICE 重启未恢复，走完整重连');
        closePeer();
        if (!live.terminal && !live.manualClose && live.ws && live.ws.readyState === WebSocket.OPEN) {
          scheduleReconnect('ICE 重启未恢复');
          try { live.ws.close(1000, 'ice restart failed'); } catch (e) { }
        }
      }
    }, 8000);
  }

  // legacy：服务端把 playerConnected 发给播放端，由浏览器创建 offer
  function onPlayerConnected(msg) {
    if (state.protocol !== 'legacy') logLine('收到 playerConnected（非 legacy 协议，仅供参考）');
    if (live.connecting && live.pc) { logLine('忽略重复的 playerConnected'); return; }
    // 关键修复：画面已在播放且 WebRTC 连接正常时，信令重连后忽略 playerConnected，
    // 不重建视频连接（否则信令闪断会把正常播放的画面打断）
    if (live.videoStarted && live.pc && live.pc.connectionState === 'connected') {
      logLine('信令重连收到 playerConnected，视频已在播放，忽略');
      return;
    }
    trace('↑', 'playerConnected', 'dataChannel=' + (msg.dataChannel !== false));
    var pc = createPeerConnection();
    var wantChannel = msg.dataChannel !== false && state.role !== 'viewer';
    var wantAudio = cfg.audio;

    // 媒体方向：浏览器只收不发
    if (wantAudio) safeAddTransceiver(pc, 'audio');
    safeAddTransceiver(pc, 'video');

    // 数据通道由浏览器创建（经典像素流），它会触发 negotiationneeded
    if (wantChannel) {
      try {
        var dc = pc.createDataChannel('hello', { ordered: true });
        setupDataChannel(dc);
      } catch (e) { logLine('创建数据通道失败：' + (e && e.message)); }
    }
    if (!live.negotiationArmed) {
      live.negotiationArmed = true;
      pc.onnegotiationneeded = function () {
        if (live.pc !== pc) return;
        negotiate(pc);
      };
    }
    // 不依赖 onnegotiationneeded 的触发时机，主动协商一次（内部有信令状态保护）
    negotiate(pc);
  }

  function safeAddTransceiver(pc, kind) {
    try { pc.addTransceiver(kind, { direction: 'recvonly' }); } catch (e) { logLine('添加 ' + kind + ' 接收通道失败：' + (e && e.message)); }
  }
  function sdpHasMedia(sdp, kind) { return new RegExp('m=' + kind + '\\b').test(String(sdp || '')); }

  function negotiate(pc) {
    if (live.pc !== pc) return;
    if (live.offerInProgress || pc.signalingState !== 'stable') return;
    live.offerInProgress = true;
    pc.createOffer({ voiceActivityDetection: false })
      .then(function (offer) {
        if (live.pc !== pc) return null;
        // 部分浏览器只在 SDP 中声明单声道；补上立体声能力（与 UE 侧一致）
        offer.sdp = String(offer.sdp || '').replace('useinbandfec=1', 'useinbandfec=1;stereo=1;sprop-maxcapturerate=48000');
        return pc.setLocalDescription(offer);
      })
      .then(function () {
        if (live.pc !== pc) return;
        sendJson({ type: 'offer', sdp: pc.localDescription.sdp });
        trace('↑', 'offer', 'legacy 本地发起');
      })
      .catch(function (e) { logLine('创建 offer 失败：' + (e && e.message)); })
      .then(function () { live.offerInProgress = false; });
  }

  // unified：UE(PixelStreaming2) 创建 offer，浏览器应答
  function onRemoteOffer(msg) {
    if (!msg.sdp) return;
    // 关键修复：画面已在播放且 WebRTC 正常时，忽略信令重连后的新 offer
    if (live.videoStarted && live.pc && live.pc.connectionState === 'connected') {
      logLine('信令重连收到 offer，视频已在播放，忽略');
      return;
    }
    trace('↓', 'offer', 'unified 远端发起');
    var pc = createPeerConnection();
    pc.setRemoteDescription({ type: 'offer', sdp: msg.sdp })
      .then(function () {
        // 远端 offer 未声明对应媒体时补一条接收通道；已声明则不重复添加（避免多余 m 行）
        if (cfg.audio && !sdpHasMedia(msg.sdp, 'audio')) safeAddTransceiver(pc, 'audio');
        if (!sdpHasMedia(msg.sdp, 'video')) safeAddTransceiver(pc, 'video');
        return pc.createAnswer();
      })
      .then(function (answer) {
        if (live.pc !== pc) return null;
        return pc.setLocalDescription(answer);
      })
      .then(function () {
        if (live.pc !== pc || !pc.localDescription) return;
        sendJson({ type: 'answer', sdp: pc.localDescription.sdp });
        trace('↑', 'answer', 'unified 本地应答');
      })
      .catch(function (e) { logLine('应答 offer 失败：' + (e && e.message)); });
  }

  function onRemoteAnswer(msg) {
    var pc = live.pc;
    if (!pc || !msg.sdp) return;
    trace('↓', 'answer');
    if (pc.signalingState !== 'have-local-offer') { logLine('忽略与当前状态不匹配的 answer：' + pc.signalingState); return; }
    pc.setRemoteDescription({ type: 'answer', sdp: msg.sdp })
      .catch(function (e) { logLine('设置远端应答失败：' + (e && e.message)); });
  }

  function onRemoteCandidate(candidate) {
    if (!candidate || !live.pc) return;
    var value = candidate.candidate !== undefined ? candidate : candidate;
    live.pc.addIceCandidate(value).catch(function (e) { logLine('添加远端候选失败：' + (e && e.message)); });
  }

  function tryPlay() {
    var p = dom.video.play();
    if (p && p.catch) p.catch(function () {
      logLine('自动播放被浏览器阻止，点击画面继续');
      dom.overlay.classList.remove('hidden');
      var hint = dom.overlay.querySelector('.hint');
      if (hint) hint.textContent = '👆 点击画面开始观看（浏览器要求用户手势才能播放）';
    });
  }

  /**
   * 视频轨道到达后：即使 play() 成功，浏览器也可能不会立刻触发 playing 事件
   * （编码器还没发第一个关键帧、或浏览器排期延迟）。加一个保底计时器，
   * 确保 overlay 在 3 秒后一定消失，不要求用户手动刷新。
   */
  function armVideoReadyFallback() {
    clearTimeout(live.videoReadyTimer);
    live.videoReadyTimer = setTimeout(function () {
      if (!live.videoStarted) {
        live.videoStarted = true;
        setStatus('connected', '已连接', '');
        logLine('视频画面就绪（保底计时器）');
      }
    }, 3000);
  }

  /* ------------------------------------------------------------------ *
   * 8. 数据通道（UE 输入/控制通道）
   * ------------------------------------------------------------------ */
  function setupDataChannel(dc) {
    if (live.dc === dc) return;
    live.dc = dc;
    try { dc.binaryType = 'arraybuffer'; } catch (e) { }
    state.dcState = dc.readyState;
    dc.onopen = function () {
      state.dcState = 'open';
      logLine('数据通道已打开');
      live.negotiationArmed = true;
      if (state.protocol === 'legacy') requestInitialSettings();
      else {
        // unified：等 UE 下发 Protocol(255) 完成 id 重映射；超时则按默认 id 兜底
        clearTimeout(live.resendTimer);
        live.resendTimer = setTimeout(function () {
          if (!live.protocolMappingReceived) { logLine('未收到 Protocol 映射，按默认 id 请求初始设置'); requestInitialSettings(); }
        }, 2000);
      }
      scheduleResolution(0);
      refreshDiag();
    };
    dc.onclose = function () {
      if (live.dc !== dc) return;
      state.dcState = 'closed';
      releaseInput();
      refreshDiag();
    };
    dc.onmessage = function (ev) { onDataChannelMessage(ev.data); };
    refreshDiag();
  }

  function requestInitialSettings() {
    sendBinary(new Uint8Array([SEND.RequestInitialSettings]));
    sendBinary(new Uint8Array([SEND.RequestQualityControl]));
  }

  function sendBinary(data) {
    if (live.dc && live.dc.readyState === 'open') { live.dc.send(data); return true; }
    return false;
  }

  function onDataChannelMessage(raw) {
    var data = new Uint8Array(raw);
    if (!data.length) return;
    var utf16 = new TextDecoder('utf-16');
    switch (data[0]) {
      case RECEIVE.VideoEncoderAvgQP:
        live.qp = +utf16.decode(data.slice(1)); break;
      case RECEIVE.Response:
        logLine('UE 回执：' + utf16.decode(data.slice(1)).slice(0, 120)); break;
      case RECEIVE.Command:
        handleUeCommand(utf16.decode(data.slice(1))); break;
      case RECEIVE.FreezeFrame:
        logLine('UE 冻结帧'); break;
      case RECEIVE.UnfreezeFrame:
        logLine('UE 解冻帧'); break;
      case RECEIVE.LatencyTest:
        logLine('UE 延迟测试：' + utf16.decode(data.slice(1)).slice(0, 80)); break;
      case RECEIVE.QualityControlOwnership:
        logLine('画质控制权：' + (data[1] !== 0 ? '已获得' : '已释放')); break;
      case RECEIVE.InputControlOwnership:
        setRole(data[1] !== 0 ? 'controller' : 'viewer'); break;
      case RECEIVE.InitialSettings:
        logLine('UE 初始设置：' + utf16.decode(data.slice(1)).slice(0, 160)); break;
      case RECEIVE.Protocol:
        applyProtocolMapping(utf16.decode(data.slice(1))); break;
      default:
        logLine('未知的数据通道消息类型：' + data[0]);
    }
  }
  function handleUeCommand(text) {
    try {
      var cmd = JSON.parse(text);
      if (cmd.command === 'onScreenKeyboard') setIme(!!cmd.showOnScreenKeyboard);
    } catch (e) { logLine('UE 指令解析失败'); }
  }
  // UE 可在运行时重映射协议 id（unified 常见）
  function applyProtocolMapping(text) {
    try {
      var protocol = JSON.parse(text);
      var target = protocol.Direction === 0 ? SEND : protocol.Direction === 1 ? RECEIVE : null;
      if (target) {
        for (var key in protocol) {
          if (key === 'Direction' || key === 'type') continue;
          if (protocol[key] && typeof protocol[key].id === 'number') target[key] = protocol[key].id;
        }
      }
      live.protocolMappingReceived = true;
      clearTimeout(live.resendTimer);
      logLine('已应用 UE 协议映射');
      requestInitialSettings();
    } catch (e) { logLine('协议映射解析失败'); }
  }

  // 构造 UE 控制台命令消息：[51][uint16 长度][UTF-16LE 字符串]
  function emitMessage(payload, messageType) {
    var type = typeof messageType === 'number' ? messageType : SEND.UIInteraction;
    var text = typeof payload === 'string' ? payload : JSON.stringify(payload);
    var view = new DataView(new ArrayBuffer(1 + 2 + 2 * text.length));
    view.setUint8(0, type);
    view.setUint16(1, text.length, true);
    for (var i = 0; i < text.length; i++) view.setUint16(3 + 2 * i, text.charCodeAt(i), true);
    return sendBinary(view);
  }
  function sendConsoleCommand(command) { return emitMessage({ ConsoleCommand: command }, SEND.Command); }

  /* ------------------------------------------------------------------ *
   * 9. 分辨率自适应：向 UE 下发 r.SetRes / r.ScreenPercentage
   * ------------------------------------------------------------------ */
  function computeTargetResolution() {
    var vw = Math.max(1, window.innerWidth || document.documentElement.clientWidth || 1);
    var vh = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 1);
    var dpr = Math.min(2, Math.max(1, Number(window.devicePixelRatio) || 1));
    // 参考服务端默认策略：桌面端不低于 1080p，再按 DPR 提高清晰度
    var heightFloor = Math.max(360, vh, 640 * vh / vw);
    var height = Math.max(heightFloor * dpr, 1080);
    var width = height * (vw / vh);
    // 上限：最长边 3840、总像素不超过 4K，避免申请超出 UE 能力的尺寸
    var scale = Math.min(1, 3840 / Math.max(width, height), Math.sqrt((3840 * 2160) / (width * height)));
    width *= scale; height *= scale;
    return { width: Math.max(2, Math.floor(width / 2) * 2), height: Math.max(2, Math.floor(height / 2) * 2) };
  }

  function scheduleResolution(delay) {
    clearTimeout(live.resolutionTimer);
    live.resolutionTimer = setTimeout(applyResolutionTarget, typeof delay === 'number' ? delay : 500);
  }

  function applyResolutionTarget() {
    if (!cfg.adaptive) return;
    if (!state.adaptiveAllowed) return;          // 服务端 rendering.adaptiveResolution=false
    if (state.role === 'viewer') return;         // 共享实例里由控制端决定分辨率
    if (!live.dc || live.dc.readyState !== 'open') return;
    var target = computeTargetResolution();
    state.targetResolution = target;
    var last = state.lastSentResolution;
    if (last) {
      var dw = Math.abs(target.width - last.width) / last.width;
      var dh = Math.abs(target.height - last.height) / last.height;
      if (dw < 0.03 && dh < 0.03) { refreshDiag(); return; }
    }
    var now = Date.now();
    if (live.lastResolutionAt && now - live.lastResolutionAt < 2000) { scheduleResolution(2000 - (now - live.lastResolutionAt)); return; }
    if (!sendConsoleCommand('r.SetRes ' + target.width + 'x' + target.height + 'w')) return;
    live.lastResolutionAt = now;
    state.lastSentResolution = target;
    logLine('请求 UE 分辨率：' + target.width + ' × ' + target.height);
    // 服务端指定了渲染比例时，r.SetRes 之后补发一次 r.ScreenPercentage（与 vendor 行为一致）
    if (state.screenPercentage) {
      setTimeout(function () { if (state.screenPercentage) sendConsoleCommand('r.ScreenPercentage ' + state.screenPercentage); }, 350);
    }
    // 校验：若 4 秒内实际画面尺寸未跟上目标，清空记录以便下次窗口变化时重发
    clearTimeout(live.resolutionVerifyTimer);
    live.resolutionVerifyTimer = setTimeout(function () {
      if (!state.videoWidth || !state.videoHeight) return;
      if (Math.abs(state.videoWidth - target.width) > 4 || Math.abs(state.videoHeight - target.height) > 4) {
        logLine('实际画面尺寸尚未跟上目标，允许重新下发');
        state.lastSentResolution = null;
      }
    }, 4000);
    refreshDiag();
  }

  /* ------------------------------------------------------------------ *
   * 10. 码率控制：根据服务端 bitrate.policy 下发 UE 控制台命令
   * ------------------------------------------------------------------ */
  function bitratePrefix() { return state.plugin === 'PixelStreaming2' ? 'PixelStreaming2' : 'PixelStreaming'; }
  function onBitratePolicy(policy) {
    trace('↓', 'bitrate.policy', 'limit=' + policy.recommendedLimitMbps + 'Mbps mode=' + (policy.mode || 'auto'));
    if (state.role === 'viewer') return;
    if (policy.mode && policy.mode !== 'auto') { state.appliedBitrateMbps = 0; refreshDiag(); return; }
    var target = Math.round(Number(policy.recommendedLimitMbps) || 0);
    if (!target || target === state.appliedBitrateMbps) return;
    if (!live.dc || live.dc.readyState !== 'open') return;
    var now = Date.now();
    if (live.lastBitrateAt && now - live.lastBitrateAt < 3000) return;
    live.lastBitrateAt = now;
    var prefix = bitratePrefix();
    var bits = target * 1000000;
    // UE5.3 不固定编码器目标码率（保持 WebRTC 自适应），仅限制带宽上限
    sendConsoleCommand(prefix + '.Encoder.TargetBitrate ' + (state.ue53 ? -1 : bits));
    sendConsoleCommand(prefix + '.WebRTC.MinBitrate ' + Math.min(100000, bits));
    sendConsoleCommand(prefix + '.WebRTC.StartBitrate ' + Math.min(1000000, bits));
    sendConsoleCommand(prefix + '.WebRTC.MaxBitrate ' + bits);
    state.appliedBitrateMbps = target;
    logLine('下发码率上限：' + target + ' Mbps（' + prefix + (state.ue53 ? '，UE5.3 兼容' : '') + '）');
    refreshDiag();
  }

  /* ------------------------------------------------------------------ *
   * 11. WebRTC 统计 -> 会话遥测（服务端据此回推 bitrate.policy）
   * ------------------------------------------------------------------ */
  function startStats() {
    if (live.statsTimer) return;
    sampleStats();
    live.statsTimer = setInterval(sampleStats, 5000);
  }
  function stopStats() {
    clearInterval(live.statsTimer);
    live.statsTimer = null;
    live.prev = null;
    state.fps = 0; state.bitrateMbps = 0; state.rttMs = 0;
  }
  function sampleStats() {
    var pc = live.pc;
    if (!pc || typeof pc.getStats !== 'function') return;
    pc.getStats(null).then(function (report) {
      if (live.pc !== pc) return;
      var inbound = null, transport = null, pair = null, local = null, remote = null;
      report.forEach(function (stat) {
        if (stat.type === 'inbound-rtp' && (stat.kind === 'video' || stat.mediaType === 'video')) inbound = stat;
        if (stat.type === 'transport') transport = stat;
        if (stat.type === 'candidate-pair' && (stat.nominated || stat.selected) && stat.state === 'succeeded') pair = stat;
      });
      if (pair) {
        local = report.get(pair.localCandidateId);
        remote = report.get(pair.remoteCandidateId);
        state.rttMs = Number(pair.currentRoundTripTime) || 0;
      }
      state.localCandidate = (local && local.candidateType) || state.localCandidate || '';
      state.remoteCandidate = (remote && remote.candidateType) || state.remoteCandidate || '';
      state.transport = String((local && local.protocol) || (remote && remote.protocol) || state.transport || '').toUpperCase();
      setRoute();
      if (!inbound) { refreshDiag(); return; }

      var width = Number(inbound.frameWidth) || 0, height = Number(inbound.frameHeight) || 0;
      if (width) { state.videoWidth = width; state.videoHeight = height; }
      var frames = Number(inbound.framesDecoded) || 0;
      var bytes = Number(inbound.bytesReceived) || 0;
      var ts = Number(inbound.timestamp) || 0;
      var received = Number(inbound.packetsReceived) || 0;
      var lost = Number(inbound.packetsLost) || 0;
      var dropped = Number(inbound.framesDropped) || 0;
      state.fps = Number(inbound.framesPerSecond) || 0;

      var prev = live.prev, elapsed = 0;
      if (prev && ts > prev.ts) elapsed = ts - prev.ts;
      var bitrate = elapsed ? Math.max(0, (bytes - prev.bytes) * 8 * 1000 / elapsed) : 0;
      state.bitrateMbps = bitrate / 1e6;
      var framesDelta = prev ? Math.max(0, frames - prev.frames) : 0;
      var receivedDelta = prev ? Math.max(0, received - prev.received) : 0;
      var lostDelta = prev ? Math.max(0, lost - prev.lost) : 0;
      var droppedDelta = prev ? Math.max(0, dropped - prev.dropped) : 0;
      live.prev = { ts: ts, bytes: bytes, frames: frames, received: received, lost: lost, dropped: dropped };

      sendJson({
        type: 'session.telemetry',
        state: (state.fps > 0 || framesDelta > 0) ? 'healthy' : 'starting',
        reason: 'media_sample',
        timestamp: new Date().toISOString(),
        fps: state.fps,
        bitrateMbps: Number(state.bitrateMbps.toFixed(2)),
        rttMs: state.rttMs,
        videoWidth: width, videoHeight: height,
        framesDecodedDelta: framesDelta,
        framesDroppedDelta: droppedDelta,
        packetsReceivedDelta: receivedDelta,
        packetsLostDelta: lostDelta,
        connectionType: state.route === '中继转发' ? 'TURN 中继' : (state.route.indexOf('局域网') === 0 ? 'P2P 直连' : '检测中'),
        transportProtocol: state.transport,
        localCandidateType: state.localCandidate,
        remoteCandidateType: state.remoteCandidate,
        dataChannel: state.dcState,
        track: live.remoteStream && live.remoteStream.getVideoTracks()[0] ? live.remoteStream.getVideoTracks()[0].readyState : 'none',
        peer: pc.connectionState, ice: pc.iceConnectionState,
        qualityMode: 'balanced',
        effectiveBitrateLimitMbps: state.appliedBitrateMbps
      });
      refreshDiag();
    }).catch(function () { });
  }

  function onGetStatus(msg) {
    // 服务端旧式带宽探测：回一个带统计值的同名消息
    var reply = Object.assign({}, msg, { videoencoderqp: live.qp, netrate: Number(state.bitrateMbps || 0).toFixed(2) });
    sendJson(reply);
  }

  /* ------------------------------------------------------------------ *
   * 12. 输入转发（鼠标 / 键盘 / 触屏 / 滚轮）
   * ------------------------------------------------------------------ */
  function inputAllowed() { return state.role !== 'viewer' && live.dc && live.dc.readyState === 'open'; }
  function releaseInput() {
    Object.keys(live.keyDown).forEach(function (code) {
      if (live.keyDown[code]) sendBinary(new Uint8Array([SEND.KeyUp, Number(code)]));
    });
    live.keyDown = {};
    live.buttonsDown = {};
  }
  function noteActivity() {
    var now = Date.now();
    if (now - live.activityAt < 1000) return;
    live.activityAt = now;
    sendJson({ type: 'session.activity', timestamp: new Date().toISOString() });
  }

  // 把元素内坐标换算成 UE 的 0..65536 归一化坐标；按当前显示模式计算画面内容区
  function contentRect() {
    var ew = Math.max(1, dom.video.clientWidth), eh = Math.max(1, dom.video.clientHeight);
    var vw = Math.max(1, state.videoWidth || ew), vh = Math.max(1, state.videoHeight || eh);
    var scale = live.fit === 'cover' ? Math.max(ew / vw, eh / vh) : Math.min(ew / vw, eh / vh);
    var w = vw * scale, h = vh * scale;
    return { left: (ew - w) / 2, top: (eh - h) / 2, width: w, height: h };
  }
  function normalize(x, y) {
    var c = contentRect();
    var nx = (x - c.left) / c.width, ny = (y - c.top) / c.height;
    if (nx < 0 || nx > 1 || ny < 0 || ny > 1) return null;
    return { x: Math.min(65535, nx * 65536), y: Math.min(65535, ny * 65536), rect: c };
  }
  function emitMouseMove(x, y, dx, dy) {
    var c = normalize(x, y); if (!c) return;
    var view = new DataView(new ArrayBuffer(9));
    view.setUint8(0, SEND.MouseMove);
    view.setUint16(1, c.x, true);
    view.setUint16(3, c.y, true);
    view.setInt16(5, dx * 65536 / c.rect.width, true);
    view.setInt16(7, dy * 65536 / c.rect.height, true);
    sendBinary(view);
  }
  function emitMouseButton(type, button, x, y) {
    var c = normalize(x, y); if (!c) return;
    var view = new DataView(new ArrayBuffer(6));
    view.setUint8(0, type);
    view.setUint8(1, button);
    view.setUint16(2, c.x, true);
    view.setUint16(4, c.y, true);
    sendBinary(view);
  }
  function emitMouseWheel(delta, x, y) {
    var c = normalize(x, y); if (!c) return;
    var view = new DataView(new ArrayBuffer(7));
    view.setUint8(0, SEND.MouseWheel);
    view.setInt16(1, Math.max(-32768, Math.min(32767, delta)), true);
    view.setUint16(3, c.x, true);
    view.setUint16(5, c.y, true);
    sendBinary(view);
  }

  function bindInput() {
    var v = dom.video;
    v.addEventListener('mouseenter', function () { if (inputAllowed()) sendBinary(new Uint8Array([SEND.MouseEnter])); });
    v.addEventListener('mouseleave', function () {
      if (!inputAllowed()) return;
      sendBinary(new Uint8Array([SEND.MouseLeave]));
      var c = contentRect();
      for (var i = 1; i <= 16; i *= 2) {
        if (live.buttonsDown[i] !== undefined) { emitMouseButton(SEND.MouseUp, live.buttonsDown[i], c.left + c.width / 2, c.top + c.height / 2); delete live.buttonsDown[i]; }
      }
    });
    v.addEventListener('mousemove', function (e) {
      noteActivity();
      if (!inputAllowed()) return;
      emitMouseMove(e.offsetX, e.offsetY, e.movementX || 0, e.movementY || 0);
    });
    v.addEventListener('mousedown', function (e) {
      noteActivity();
      if (!inputAllowed()) return;
      live.buttonsDown[e.buttons] = e.button;
      emitMouseButton(SEND.MouseDown, e.button, e.offsetX, e.offsetY);
    });
    v.addEventListener('mouseup', function (e) {
      if (!inputAllowed()) return;
      delete live.buttonsDown[e.buttons];
      emitMouseButton(SEND.MouseUp, e.button, e.offsetX, e.offsetY);
    });
    // 右键菜单出现前先释放按键，避免 UE 侧鼠标卡住
    v.addEventListener('contextmenu', function (e) {
      if (inputAllowed()) emitMouseButton(SEND.MouseUp, e.button, e.offsetX, e.offsetY);
      e.preventDefault();
    });
    v.addEventListener('wheel', function (e) {
      noteActivity();
      if (!inputAllowed()) return;
      e.preventDefault();
      var delta = typeof e.wheelDelta === 'number' ? e.wheelDelta : -e.deltaY;
      emitMouseWheel(Math.round(delta), e.offsetX, e.offsetY);
    }, { passive: false });

    window.addEventListener('keydown', function (e) {
      noteActivity();
      if (!inputAllowed()) return;
      var code = SpecialKeyCodes[e.code] || e.keyCode;
      if (live.keyDown[code]) return;
      live.keyDown[code] = true;
      sendBinary(new Uint8Array([SEND.KeyDown, code & 0xff, e.repeat ? 1 : 0]));
      if (e.key && e.key.length === 1) emitKeyPress(e.key.charCodeAt(0));
      if (e.keyCode === SpecialKeyCodes.Backspace) emitKeyPress(SpecialKeyCodes.Backspace);
    });
    window.addEventListener('keyup', function (e) {
      var code = SpecialKeyCodes[e.code] || e.keyCode;
      delete live.keyDown[code];
      if (inputAllowed()) sendBinary(new Uint8Array([SEND.KeyUp, code & 0xff]));
    });
    window.addEventListener('blur', releaseInput);

    // 触屏：单指映射为鼠标，避免额外实现触屏协议
    var touchId = null;
    v.addEventListener('touchstart', function (e) {
      noteActivity();
      if (!inputAllowed() || !e.changedTouches.length) return;
      var t = e.changedTouches[0];
      var r = v.getBoundingClientRect();
      touchId = t.identifier;
      sendBinary(new Uint8Array([SEND.MouseEnter]));
      emitMouseButton(SEND.MouseDown, 0, t.clientX - r.left, t.clientY - r.top);
      e.preventDefault();
    }, { passive: false });
    v.addEventListener('touchmove', function (e) {
      if (!inputAllowed() || touchId === null) return;
      var r = v.getBoundingClientRect();
      for (var i = 0; i < e.touches.length; i++) {
        var t = e.touches[i];
        if (t.identifier !== touchId) continue;
        var last = live.lastTouch || { x: t.clientX - r.left, y: t.clientY - r.top };
        emitMouseMove(t.clientX - r.left, t.clientY - r.top, (t.clientX - r.left) - last.x, (t.clientY - r.top) - last.y);
        live.lastTouch = { x: t.clientX - r.left, y: t.clientY - r.top };
      }
      e.preventDefault();
    }, { passive: false });
    v.addEventListener('touchend', function (e) {
      if (!inputAllowed()) return;
      var r = v.getBoundingClientRect();
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        if (t.identifier !== touchId) continue;
        emitMouseButton(SEND.MouseUp, 0, t.clientX - r.left, t.clientY - r.top);
        sendBinary(new Uint8Array([SEND.MouseLeave]));
        touchId = null;
        live.lastTouch = null;
      }
      e.preventDefault();
    }, { passive: false });
  }
  function emitKeyPress(keyCode) {
    var view = new DataView(new ArrayBuffer(3));
    view.setUint8(0, SEND.KeyPress);
    view.setUint16(1, keyCode, true);
    sendBinary(view);
  }

  /* ------------------------------------------------------------------ *
   * 13. 中文（输入法）输入：合成结束后逐字符以 KeyPress 发送
   * ------------------------------------------------------------------ */
  function setIme(on) {
    if (on && !inputAllowed()) { logLine('控制通道未就绪，无法开启中文输入'); return; }
    dom.btnIme.classList.toggle('on', !!on);
    if (on) { dom.imeField.focus({ preventScroll: true }); }
    else { dom.imeField.value = ''; dom.imeField.blur(); }
  }
  function bindIme() {
    var field = dom.imeField, composing = false;
    field.addEventListener('compositionstart', function () { composing = true; releaseInput(); });
    field.addEventListener('compositionend', function (e) { composing = false; sendText(e.data || ''); field.value = ''; });
    field.addEventListener('input', function (e) { if (composing || e.isComposing) return; sendText(field.value); field.value = ''; });
    field.addEventListener('paste', function (e) {
      e.preventDefault();
      sendText(String((e.clipboardData && e.clipboardData.getData('text/plain')) || '').replace(/\r\n|\n/g, '\r'));
      field.value = '';
    });
    field.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { setIme(false); return; }
      if (composing || e.isComposing || e.keyCode === 229) return;
      noteActivity();
      if (!inputAllowed()) return;
      var code = SpecialKeyCodes[e.code] || e.keyCode;
      if (e.ctrlKey || e.metaKey) return;   // 浏览器快捷键交给浏览器处理
      live.keyDown[code] = true;
      sendBinary(new Uint8Array([SEND.KeyDown, code & 0xff, e.repeat ? 1 : 0]));
      if (e.key === 'Enter') { e.preventDefault(); emitKeyPress(13); }
    });
    field.addEventListener('keyup', function (e) {
      var code = SpecialKeyCodes[e.code] || e.keyCode;
      delete live.keyDown[code];
      if (inputAllowed()) sendBinary(new Uint8Array([SEND.KeyUp, code & 0xff]));
    });
    field.addEventListener('blur', function () { releaseInput(); });
  }
  function sendText(text) {
    if (!inputAllowed() || !text) return;
    for (var i = 0; i < text.length; i++) emitKeyPress(text.charCodeAt(i));
  }

  /* ------------------------------------------------------------------ *
   * 14. 界面交互
   * ------------------------------------------------------------------ */
  function bindUi() {
    // 全屏：桌面用 Fullscreen API，iOS 用 video.webkitEnterFullscreen，安卓用 video.requestFullscreen
    dom.btnFull.addEventListener('click', function () {
      var vid = dom.video;
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
      } else if (vid.requestFullscreen) {
        vid.requestFullscreen().catch(function (e) { logLine('全屏失败：' + (e && e.message)); });
      } else if (vid.webkitRequestFullscreen) {
        vid.webkitRequestFullscreen();
      } else if (vid.webkitEnterFullscreen) {
        vid.webkitEnterFullscreen(); // iOS Safari
      } else {
        logLine('当前浏览器不支持全屏');
      }
    });
    function onFsChange() {
      var isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || (dom.video && dom.video.webkitDisplayingFullscreen));
      dom.btnFull.textContent = isFs ? '退出全屏' : '全屏';
      scheduleResolution(600);
    }
    document.addEventListener('fullscreenchange', onFsChange);
    document.addEventListener('webkitfullscreenchange', onFsChange);
    if (dom.video) dom.video.addEventListener('webkitbeginfullscreen', onFsChange);
    if (dom.video) dom.video.addEventListener('webkitendfullscreen', onFsChange);

    dom.btnFit.addEventListener('click', function () {
      live.fit = live.fit === 'contain' ? 'cover' : 'contain';
      dom.video.classList.toggle('fill', live.fit === 'cover');
      dom.btnFit.textContent = live.fit === 'cover' ? '铺满' : '完整显示';
      dom.btnFit.classList.toggle('on', live.fit === 'cover');
    });

    dom.btnSound.addEventListener('click', function () {
      live.unmuted = !live.unmuted;
      dom.video.muted = !live.unmuted;
      if (live.unmuted) { tryPlay(); dom.btnSound.textContent = '有声'; }
      else dom.btnSound.textContent = '已静音';
      dom.btnSound.classList.toggle('on', live.unmuted);
    });

    dom.btnIme.addEventListener('click', function () { setIme(!dom.btnIme.classList.contains('on')); });

    dom.btnRole.addEventListener('click', function () {
      if (state.role !== 'viewer') return;
      // 共享实例下申请输入控制权
      if (sendJson({ type: 'session.control.request', timestamp: new Date().toISOString() })) {
        dom.btnRole.textContent = '申请中…';
        logLine('已提交控制权申请');
      } else {
        logLine('控制权申请发送失败：信令未连接');
      }
    });

    dom.btnDiag.addEventListener('click', function () {
      dom.panel.classList.toggle('show');
      dom.btnDiag.classList.toggle('on', dom.panel.classList.contains('show'));
    });

    // 首次用户手势时解除静音（浏览器自动播放策略）
    var unmuteOnce = function () {
      if (live.unmuted) return;
      live.unmuted = true;
      dom.video.muted = false;
      dom.btnSound.textContent = '有声';
      dom.btnSound.classList.add('on');
      tryPlay();
    };
    document.addEventListener('pointerdown', unmuteOnce, { once: true, capture: true });
    document.addEventListener('keydown', unmuteOnce, { once: true, capture: true });

    // 窗口 / 视口尺寸变化：视频由 CSS 自动缩放，同时向 UE 申请匹配分辨率
    var onResize = function () { scheduleResolution(500); };
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', function () { scheduleResolution(800); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { scheduleResolution(800); });
    dom.video.addEventListener('loadedmetadata', function () {
      state.videoWidth = dom.video.videoWidth;
      state.videoHeight = dom.video.videoHeight;
      refreshDiag();
      scheduleResolution(200);
    });
    dom.video.addEventListener('playing', function () {
      live.videoStarted = true;
      clearTimeout(live.videoReadyTimer);
      setStatus('connected', '已连接', '');
      refreshDiag();
    });
    // 点击 overlay = 用户手势 → 强制播放 + 启用声音
    dom.overlay.addEventListener('click', function () {
      dom.video.muted = false;
      live.unmuted = true;
      tryPlay();
    });
    if (cfg.debug) { dom.panel.classList.add('show'); dom.btnDiag.classList.add('on'); }

    // 定时复查：控制通道恢复或服务端策略变化后补发分辨率
    setInterval(function () { if (state.phase === 'connected') applyResolutionTarget(); }, 15000);
  }

  /* ------------------------------------------------------------------ *
   * 15. 启动
   * ------------------------------------------------------------------ */
  function boot() {
    bindUi();
    bindInput();
    bindIme();
    // 工具栏自动显示/隐藏：桌面=鼠标悬停顶部；移动端=点击顶部热区切换
    (function () {
      var hideTimer = null;
      var isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
      function showDock() { clearTimeout(hideTimer); dom.dock.classList.add('show'); }
      function hideDock() { hideTimer = setTimeout(function () { dom.dock.classList.remove('show'); }, 600); }
      function toggleDock() {
        if (dom.dock.classList.contains('show')) { clearTimeout(hideTimer); dom.dock.classList.remove('show'); }
        else { clearTimeout(hideTimer); dom.dock.classList.add('show'); }
      }
      if (isTouch) {
        // 移动端：点击热区切换显隐
        dom.dockHot.addEventListener('click', toggleDock);
        dom.dock.addEventListener('click', function () { clearTimeout(hideTimer); });
      } else {
        dom.dockHot.addEventListener('mouseenter', showDock);
        dom.dockHot.addEventListener('mouseleave', hideDock);
      }
      dom.dock.addEventListener('mouseenter', showDock);
      dom.dock.addEventListener('mouseleave', hideDock);
    })();
    setRole(cfg.viewOnly ? 'viewer' : 'controller');
    setStatus('init', '正在初始化', '正在读取连接参数…');
    logLine(BRAND + ' 播放页启动：project=' + (cfg.project || '(空)') + '，信令 ' + cfg.scheme + '://' + cfg.host + ':' + cfg.port);
    connect();
  }

  // 供自动化验证读取的只读入口
  window.__sxlPlayer = {
    brand: BRAND,
    config: cfg,
    get state() { return state; },
    get diagnostics() {
      return {
        phase: state.phase, status: state.status, protocol: state.protocol, plugin: state.plugin,
        sessionId: state.sessionId, instanceId: state.instanceId, dcState: state.dcState,
        role: state.role, videoWidth: state.videoWidth, videoHeight: state.videoHeight,
        targetResolution: state.targetResolution, fps: state.fps, bitrateMbps: state.bitrateMbps,
        route: state.route, received: state.received.slice(), errorCode: state.errorCode,
        adaptiveAllowed: state.adaptiveAllowed, screenPercentage: state.screenPercentage
      };
    },
    setFit: function (mode) { live.fit = mode === 'cover' ? 'cover' : 'contain'; dom.video.classList.toggle('fill', live.fit === 'cover'); },
    applyResolutionTarget: applyResolutionTarget,
    emitMessage: emitMessage,
    sendConsoleCommand: sendConsoleCommand
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
